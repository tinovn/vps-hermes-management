[project]
name = "hermes-rag"
version = "0.1.0"
description = "Local RAG retrieval service for Hermes Agent, exposed over MCP (StreamableHTTP)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastembed>=0.4,<1.0",
    "numpy>=1.26",
    "pypdf>=4.0",
    # Ghim <2: mcp 2.0 bỏ mcp.server.fastmcp (FastMCP tách thành package
    # riêng), nên bản >=2 làm hermes-rag chết ngay lúc khởi động với
    # ModuleNotFoundError: No module named 'mcp.server.fastmcp'.
    # Không nâng lên fastmcp 3.x nếu chưa sửa store.py: FastMCP 3 chạy
    # tool ở thread khác và kết nối SQLite hiện tại không dùng chung
    # thread được ("SQLite objects created in a thread can only be used
    # in that same thread").
    "mcp>=1.9,<2",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[project.scripts]
hermes-rag = "hermes_rag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hermes_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
